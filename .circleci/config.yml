version: 2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2023.06
    working_directory: ~/project
    resource_class: large

jobs:
  build:
    executor: android-executor
    steps:
      - checkout

      - run:
          name: Beri Izin Eksekusi Gradle Wrapper
          command: chmod +x gradlew

      - restore_cache:
          keys:
            - gradle-cache-v1-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}
            - gradle-cache-v1-

      - run:
          name: Cek Versi Java dan Gradle
          command: |
            java -version
            ./gradlew --version

      - run:
          name: Set Java Version
          command: export JAVA_HOME=$(/usr/libexec/java_home -v 17)

      - run:
          name: Bersihkan Build Lama
          command: ./gradlew clean

      - run:
          name: Install Dependencies
          command: ./gradlew dependencies

      - run:
          name: Build Debug APK
          command: ./gradlew assembleDebug

      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-cache-v1-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}

      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: apk

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
