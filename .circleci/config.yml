version: 2.1

executors:
  android-executor:
    docker:
      - image: cimg/android:2023.06
    working_directory: ~/project
    resource_class: large

jobs:
  build:
    executor: android-executor
    steps:
      - checkout

      # Cache Gradle untuk mempercepat build
      - restore_cache:
          keys:
            - gradle-cache-v1-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}
            - gradle-cache-v1-

      # Cek versi Java & Gradle
      - run:
          name: Cek Versi Java dan Gradle
          command: |
            java -version
            ./gradlew --version

      # Set JDK (pastikan sesuai dengan yang digunakan di lokal)
      - run:
          name: Set Java Version
          command: export JAVA_HOME=$(/usr/libexec/java_home -v 17)

      # Bersihkan build sebelumnya
      - run:
          name: Bersihkan Build Lama
          command: ./gradlew clean

      # Install dependencies
      - run:
          name: Install Dependencies
          command: ./gradlew dependencies

      # Build APK Debug
      - run:
          name: Build Debug APK
          command: ./gradlew assembleDebug

      # Simpan cache untuk build berikutnya
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-cache-v1-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}

      # Simpan APK sebagai artifact
      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: apk

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
